# Loudness pass for finals already in the private "renders" release (render.yml now runs the same
# gate on every new final). Downloads each named asset, measures it, re-masters the audio when it is
# outside -15..-13 LUFS / above -1 dBTP (video stream copied, never re-encoded), and re-uploads it.
# gh workflow run master.yml -f assets=l01-final.mp4,l02-final.mp4
name: Master loudness

on:
  workflow_dispatch:
    inputs:
      assets:
        description: comma-separated asset names in the renders release
        required: true
        type: string

permissions:
  contents: write

jobs:
  master:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASSETS: ${{ inputs.assets }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg
        run: |
          timeout 240 bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null' || { curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp && sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff{mpeg,probe} /usr/local/bin/; }
          ffmpeg -version | head -1
      - name: Measure and fix
        run: |
          mkdir -p work
          IFS=',' read -ra names <<< "$ASSETS"
          for name in "${names[@]}"; do
            name=$(echo "$name" | xargs)
            case "$name" in *.mp4) ;; *) echo "::error::not an mp4: $name"; exit 1 ;; esac
            gh release download renders -p "$name" -D work --clobber
            before=$(sha1sum "work/$name" | cut -d' ' -f1)
            bash studio/scripts/loudness-fix.sh "work/$name"
            probe=$(ffprobe -v error -show_entries stream=codec_type:format=duration -of compact "work/$name")
            echo "$probe" | grep -q "codec_type=audio" && echo "$probe" | grep -q "codec_type=video" || { echo "::error::$name lost a stream"; exit 1; }
            if [ "$(sha1sum "work/$name" | cut -d' ' -f1)" != "$before" ]; then
              gh release upload renders "work/$name" --clobber
              echo "re-uploaded $name" >> "$GITHUB_STEP_SUMMARY"
            fi
            rm "work/$name"
          done
